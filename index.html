<!DOCTYPE html>
<html>
<head>
<title>Memory Card Game</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>

<script>
$(document).ready(function(){
  var css = "";
  css += "*{ box-sizing:border-box; }";
  css += "body{ margin:0; min-height:100vh; text-align:center; font-family:'Segoe UI', Arial, sans-serif; background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80'); background-size:cover; background-position:center; background-repeat:no-repeat; color:#1f2937; display:flex; flex-direction:column; align-items:center; justify-content:center; }";
  css += "h1{ margin:0 0 12px; color:#ffffff; font-size:2.3rem; letter-spacing:0.06em; text-transform:uppercase; text-shadow:0 3px 10px rgba(0,0,0,0.45); }";
  css += "#board{ display:grid; grid-template-columns:repeat(4, 80px); gap:14px; margin-top:18px; padding:18px; background:cyan; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.2); border-radius:22px; box-shadow:0 20px 45px rgba(15,23,42,0.32); }";
  css += ".card{ width:80px; height:80px; background:linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color:transparent; display:flex; align-items:center; justify-content:center; margin:0; font-size:30px; font-weight:700; line-height:normal; cursor:pointer; border-radius:16px; border:2px solid rgba(255,255,255,0.4); box-shadow:0 10px 20px rgba(79,70,229,0.25); transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; user-select:none; }";
  css += ".card:hover{ transform:translateY(-2px); box-shadow:0 12px 22px rgba(79,70,229,0.28); }";
  css += ".open{ background:linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%); color:#111827; border-color:rgba(99,102,241,0.2); }";
  css += ".match{ background:linear-gradient(135deg, #86efac 0%, #22c55e 100%); color:#052e16; border-color:rgba(21,128,61,0.25); }";
  css += "#msg{ margin-top:16px; font-size:1.15rem; font-weight:600; color:#ffffff; text-shadow:0 2px 8px rgba(0,0,0,0.4); }";
  css += "button{ margin-top:15px; padding:12px 22px; font-size:1rem; font-weight:700; cursor:pointer; border:none; border-radius:999px; background:linear-gradient(135deg, #4338ca 0%, #7c3aed 100%); color:#fff; box-shadow:0 10px 20px rgba(79,70,229,0.25); transition:transform 0.2s ease, box-shadow 0.2s ease; }";
  css += "button:hover{ transform:translateY(-1px); box-shadow:0 12px 22px rgba(79,70,229,0.3); }";

  var styleTag = $("<style>");
  styleTag.text(css);
  styleTag.appendTo("head");


  var heading = $("<h1>");
  heading.text("Memory Card Game");
  heading.appendTo("body");


  var msg = $("<p>");
  msg.attr("id", "msg");
  msg.text("Moves: 0");
  msg.appendTo("body");


  var board = $("<div>");
  board.attr("id", "board");
  board.appendTo("body");

  var br = $("<br>");
  br.appendTo("body");

  var restartBtn = $("<button>");
  restartBtn.attr("id", "restartBtn");
  restartBtn.text("Restart");
  restartBtn.appendTo("body");


  var items = ["A","B","C","D","E","F","G","H"];
  var cards = [];
  var first = null;
  var second = null;
  var moveCount = 0;
  var matchCount = 0;
  var canClick = true;

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function startGame(){
    $("#board").empty();
    first = null;
    second = null;
    moveCount = 0;
    matchCount = 0;
    canClick = true;
    $("#msg").text("Moves: 0");

    cards = shuffle(items.concat(items));

    for(var i = 0; i < cards.length; i++){
      var div = $("<div>");
      div.addClass("card");
      div.attr("data-value", cards[i]);
      div.text("?");
      div.appendTo("#board");
    }
  }

  $("#board").on("click", ".card", function(){
    var card = $(this);

    if(canClick == false){ return; }
    if(card.hasClass("open") || card.hasClass("match")){ return; }

    card.addClass("open");
    card.text(card.attr("data-value"));

    if(first == null){
      first = card;
    } else {
      second = card;
      canClick = false;
      moveCount++;
      $("#msg").text("Moves: " + moveCount);

      if(first.attr("data-value") == second.attr("data-value")){
        first.addClass("match");
        second.addClass("match");
        matchCount++;
        first = null;
        second = null;
        canClick = true;

        if(matchCount == items.length){
          setTimeout(function(){
            $("#msg").text("You Won! Total Moves: " + moveCount);
          }, 200);
        }
      } else {
        setTimeout(function(){
          first.removeClass("open").text("?");
          second.removeClass("open").text("?");
          first = null;
          second = null;
          canClick = true;
        }, 700);
      }
    }
  });

  $("#restartBtn").on("click", function(){
    startGame();
  });

  startGame();

});
</script>

</body>
</html>
